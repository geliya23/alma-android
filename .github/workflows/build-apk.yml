name: Build APK

on:
  workflow_dispatch:
    inputs:
      renderer_version:
        description: 'renderer 版本说明（仅用于产物命名）'
        required: false
        default: '0.4.259'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ubuntu-latest 已预装 Android SDK，不用 setup-android（它会去装已废弃的 tools 包而失败）
      - name: Prepare Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "SDK 根目录: $ANDROID_HOME"
          ls "$ANDROID_HOME" || true

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)"
          echo "sdkmanager: $SDKMANAGER"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools" 2>&1 | tail -5 || true
          fi

          echo "--- 可用 platforms ---"
          ls "$ANDROID_HOME/platforms" || true
          echo "--- 可用 build-tools ---"
          ls "$ANDROID_HOME/build-tools" || true

      - name: Show renderer version
        run: |
          echo "www/ 内 renderer 版本："
          grep -o '"version"[^,]*' www/assets/*.js 2>/dev/null | head -3 || true
          ls www | head -20

      - name: npm install
        run: npm install --no-audit --no-fund

      - name: Capacitor sync
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          find android/app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          ls -lh out/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alma-android-apk
          path: out/*.apk
          retention-days: 30
