name: Build APK

on:
  workflow_dispatch:
    inputs:
      renderer_version:
        description: 'renderer 版本说明（仅用于产物命名）'
        required: false
        default: '0.4.259'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Show renderer version
        run: |
          echo "www/ 内 renderer 版本："
          grep -o '"version"[^,]*' www/assets/*.js 2>/dev/null | head -3 || true
          ls www | head -20

      - name: npm install
        run: npm install --no-audit --no-fund

      - name: Capacitor sync
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          find android/app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          ls -lh out/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alma-android-apk
          path: out/*.apk
          retention-days: 30
